# Supabase 무료 프로젝트는 7일간 요청이 없으면 일시정지된다.
# 주 2회 Edge Function에 ping을 보내 활성 상태를 유지한다.
name: Supabase Keep-Alive

on:
  schedule:
    - cron: "0 0 * * 1,4" # 매주 월/목 00:00 UTC
  workflow_dispatch: # 수동 실행도 가능

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping comments function
        env:
          NEXT_PUBLIC_COMMENTS_API_URL: ${{ secrets.NEXT_PUBLIC_COMMENTS_API_URL }}
          COMMENTS_API_URL: ${{ secrets.COMMENTS_API_URL }}
        run: |
          url="${NEXT_PUBLIC_COMMENTS_API_URL:-${COMMENTS_API_URL:-}}"

          if [ -z "$url" ]; then
            echo "::error::Missing GitHub Actions secret NEXT_PUBLIC_COMMENTS_API_URL."
            exit 1
          fi

          curl -fsS "${url}?slug=ping" >/dev/null
