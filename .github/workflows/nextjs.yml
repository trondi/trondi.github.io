name: Deploy Next.js site to Pages

on:
  push:
    branches: ["main"]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 시크릿이 비어도 빌드는 성공하고 댓글·반응·조회수만 조용히 사라지므로 여기서 막는다
      - name: Check Required Secrets
        env:
          NEXT_PUBLIC_COMMENTS_API_URL: ${{ secrets.NEXT_PUBLIC_COMMENTS_API_URL }}
        run: |
          if [ -z "$NEXT_PUBLIC_COMMENTS_API_URL" ]; then
            echo "::error::Missing GitHub Actions secret NEXT_PUBLIC_COMMENTS_API_URL."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "yarn"

      - name: Install Dependencies
        run: yarn install --frozen-lockfile # ✅ Next.js 설치 먼저 진행

      - name: Build Next.js
        run: NEXT_IGNORE_TS_ERRORS=true yarn next build # ✅ Next.js 설치 후 실행
        env:
          # 댓글 Edge Function 엔드포인트 — 미설정 시 위 Check Required Secrets 단계에서 실패
          NEXT_PUBLIC_COMMENTS_API_URL: ${{ secrets.NEXT_PUBLIC_COMMENTS_API_URL }}

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
